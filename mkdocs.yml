site_name: polars-anta
site_description: ANTA (Alpha & Numerical Technical Analysis) - Ultra-fast, zero-C technical analysis and factor library for Polars.
site_author: An Phan (Phan Bùi Hữu Ân)
site_url: https://huuan26.github.io/polars-anta/
repo_url: https://github.com/huuan26/polars-anta
repo_name: huuan26/polars-anta

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - def_list
  - toc:
      permalink: true

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Benchmarks: benchmarks.md
  - Indicators:
      - Catalog Overview: indicators/index.md
      - Trend & Overlays (27): indicators/trend.md
      - Momentum Oscillators (20): indicators/momentum.md
      - Volatility & Channels (18): indicators/volatility.md
      - Volume Dynamics (15): indicators/volume.md
      - Quantitative Statistics (12): indicators/stats.md
      - Alpha Factor Primitives (14): indicators/alpha.md
  - Guides:
      - Multi-Asset Scaling: guides/multi-asset.md
      - Resampling & DataFrame API: guides/resampling-and-dataframe-api.md
  - Contributing: contributing.md
