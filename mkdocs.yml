site_name: polars-anta
site_description: ANTA (Alpha & Numerical Technical Analysis) - Quantitative technical analysis, cross-sectional alpha research, and vectorized backtesting in Polars.
site_author: An Phan (Phan Bùi Hữu Ân)
site_url: https://huuan26.github.io/polars-anta/
repo_url: https://github.com/huuan26/polars-anta
repo_name: huuan26/polars-anta

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  language: en
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - API Reference:
      - Catalog & Module Overview: indicators/index.md
      - Trend & Overlays: indicators/trend.md
      - Momentum Oscillators: indicators/momentum.md
      - Volatility & Channels: indicators/volatility.md
      - Volume & Money Flow: indicators/volume.md
      - Statistics & OLS Regression: indicators/stats.md
      - Alpha & Microstructure: indicators/alpha.md
      - Factor Evaluation & Backtesting: indicators/evaluation-and-backtest.md
      - Statistical Inference & Falsification: indicators/inference.md
  - Guides & Quantitative Theory:
      - Quantitative Theory & Workflows: guides/quant-theory-and-workflows.md
      - Multi-Asset & Cross-Sectional Scaling: guides/multi-asset.md
      - Information Bars, Roll & Resampling: guides/resampling-and-dataframe-api.md
      - Architecture & Mathematical Proofs: architecture.md
      - Benchmarks: benchmarks.md
  - Research:
      - Factor Zoo Study: research/factor-zoo.md
  - Contributing: contributing.md
